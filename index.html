<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>STARLUX 準機師刷題系統｜133題完整題庫</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
    body {
      font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #0f141c;
      color: #f3f4f6;
    }
    .starlux-gold { color: #d4af37; }
    .starlux-bg-gold { background-color: #c59b27; }
    .starlux-border-gold { border-color: #c59b27; }
    .card-bg { background-color: #18202c; border: 1px solid #283344; }
    .opt-btn { transition: all 0.15s ease; }
    .opt-btn:hover:not(:disabled) { border-color: #c59b27; background-color: #212b3b; }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- Top Header -->
  <header class="border-b border-gray-800 bg-[#131923] sticky top-0 z-30">
    <div class="max-w-4xl mx-auto px-4 py-3.5 flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center gap-2.5">
        <div class="w-9 h-9 rounded-lg bg-gradient-to-br from-[#d4af37] to-[#8c6b14] flex items-center justify-center text-gray-950 font-black text-lg shadow">
          ✦
        </div>
        <div>
          <h1 class="text-base sm:text-lg font-bold tracking-wide text-white leading-tight">
            STARLUX 準機師筆試刷題庫
          </h1>
          <p class="text-xs text-gray-400">全收錄 133 題（含勘誤校正、改編題與機隊變化題）</p>
        </div>
      </div>

      <div class="flex items-center gap-3 text-xs sm:text-sm">
        <div class="px-3 py-1.5 rounded-full bg-gray-800/90 border border-gray-700 flex items-center gap-1.5">
          <span class="text-amber-400">🔥</span>
          <span>連續打卡：<strong id="streakCount" class="text-white">0</strong> 天</span>
        </div>
        <div class="px-3 py-1.5 rounded-full bg-gray-800/90 border border-gray-700 flex items-center gap-1.5">
          <span class="text-emerald-400">✓</span>
          <span>已掌握：<strong id="masteredCount" class="text-white">0</strong>/133</span>
        </div>
      </div>
    </div>

    <!-- Navigation Tabs -->
    <nav class="max-w-4xl mx-auto px-4 flex gap-1 overflow-x-auto text-sm font-medium">
      <button onclick="switchTab('daily')" id="tab-daily" class="tab-btn px-4 py-2.5 border-b-2 border-[#d4af37] text-[#d4af37] whitespace-nowrap">
        📅 每日 10 題挑戰
      </button>
      <button onclick="switchTab('practice')" id="tab-practice" class="tab-btn px-4 py-2.5 border-b-2 border-transparent text-gray-400 hover:text-gray-200 whitespace-nowrap">
        📚 全題庫分類刷題
      </button>
      <button onclick="switchTab('wrong')" id="tab-wrong" class="tab-btn px-4 py-2.5 border-b-2 border-transparent text-gray-400 hover:text-gray-200 whitespace-nowrap">
        🚨 錯題本 (<span id="wrongBadge">0</span>)
      </button>
      <button onclick="switchTab('browse')" id="tab-browse" class="tab-btn px-4 py-2.5 border-b-2 border-transparent text-gray-400 hover:text-gray-200 whitespace-nowrap">
        🔍 題庫搜尋總覽
      </button>
    </nav>
  </header>

  <!-- Main Content -->
  <main class="max-w-4xl w-full mx-auto px-4 py-6 flex-1">

    <!-- TAB 1: DAILY 10 -->
    <section id="view-daily" class="space-y-5">
      <div class="card-bg rounded-xl p-5 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
        <div>
          <div class="flex items-center gap-2">
            <span class="text-xs font-bold uppercase tracking-wider px-2.5 py-0.5 rounded bg-amber-500/20 text-amber-300 border border-amber-500/30">
              TODAY'S MISSION
            </span>
            <span id="todayDateLabel" class="text-xs text-gray-400"></span>
          </div>
          <h2 class="text-xl font-bold text-white mt-1.5">今日專屬 10 題任務</h2>
          <p class="text-sm text-gray-400 mt-0.5">系統自動優先挑選你的「錯題」與「尚未寫過的新題」，每天 10 題穩紮穩打。</p>
        </div>
        <div class="flex items-center gap-2 shrink-0">
          <button onclick="generateNewDailySet(true)" class="px-3.5 py-2 rounded-lg bg-gray-800 hover:bg-gray-700 text-gray-200 text-xs sm:text-sm font-medium border border-gray-700">
            🔄 換一組新 10 題
          </button>
        </div>
      </div>

      <div id="dailyQuizContainer" class="space-y-4"></div>
    </section>

    <!-- TAB 2: PRACTICE ALL -->
    <section id="view-practice" class="hidden space-y-5">
      <div class="card-bg rounded-xl p-4 flex flex-wrap items-center justify-between gap-3">
        <div class="flex flex-wrap items-center gap-2">
          <label class="text-xs text-gray-400">題庫分類：</label>
          <select id="categoryFilter" onchange="resetPractice()" class="bg-gray-900 border border-gray-700 text-gray-100 text-sm rounded-lg px-3 py-1.5 focus:outline-none focus:border-[#d4af37]">
            <option value="ALL">全部題目 (133 題)</option>
            <option value="航空基礎與星宇">航空基礎與星宇品牌/機隊</option>
            <option value="飛航與航空常識">飛航原理、氣象與法規常識</option>
            <option value="計算與方位時區">計算、經緯度方位與時區</option>
            <option value="星宇機隊變化題組">🔥 星宇 39 架機隊變化題組 (必背)</option>
          </select>

          <select id="orderFilter" onchange="resetPractice()" class="bg-gray-900 border border-gray-700 text-gray-100 text-sm rounded-lg px-3 py-1.5 focus:outline-none focus:border-[#d4af37]">
            <option value="SEQ">依題號順序</option>
            <option value="SHUFFLE">隨機亂數抽題</option>
            <option value="UNMASTERED">只看尚未答對題目</option>
          </select>
        </div>

        <div class="text-xs text-gray-400">
          目前進度：<span id="practiceProgressText" class="text-white font-bold">1 / 133</span>
        </div>
      </div>

      <div id="singleQuestionCard"></div>
    </section>

    <!-- TAB 3: WRONG BOOK -->
    <section id="view-wrong" class="hidden space-y-5">
      <div class="card-bg rounded-xl p-5 flex flex-wrap items-center justify-between gap-3">
        <div>
          <h2 class="text-lg font-bold text-white">🚨 個人錯題複習本</h2>
          <p class="text-sm text-gray-400">只要答錯就會自動收錄於此；在錯題本中重新答對即可移出。</p>
        </div>
        <button onclick="clearWrongBook()" class="px-3 py-1.5 rounded-lg bg-red-950/60 hover:bg-red-900/60 text-red-300 border border-red-800/60 text-xs">
          清空錯題紀錄
        </button>
      </div>
      <div id="wrongListContainer" class="space-y-4"></div>
    </section>

    <!-- TAB 4: BROWSE & SEARCH -->
    <section id="view-browse" class="hidden space-y-4">
      <div class="card-bg rounded-xl p-4 flex flex-col sm:flex-row gap-3">
        <input
          type="text"
          id="searchInput"
          oninput="renderBrowseList()"
          placeholder="輸入關鍵字搜尋題目或解析（例如：39、A350F、北極星、777、時區、GPWS...）"
          class="flex-1 bg-gray-900 border border-gray-700 rounded-lg px-4 py-2 text-sm text-white placeholder-gray-500 focus:outline-none focus:border-[#d4af37]"
        />
        <button onclick="toggleAllAnswersBrowse()" id="toggleAnsBtn" class="px-4 py-2 rounded-lg bg-gray-800 hover:bg-gray-700 text-xs sm:text-sm text-amber-300 border border-gray-700 whitespace-nowrap">
          👁️ 顯示/隱藏全部解析
        </button>
      </div>
      <div id="browseCountLabel" class="text-xs text-gray-400 px-1"></div>
      <div id="browseListContainer" class="space-y-3"></div>
    </section>

  </main>

  <footer class="border-t border-gray-800/80 py-4 text-center text-xs text-gray-500">
    STARLUX Cadet Pilot Prep • 進度自動儲存於瀏覽器本機 (LocalStorage)
  </footer>

  <script>
    const QUESTIONS = [
  {
    "id": "Q1",
    "cat": "航空基礎與星宇",
    "q": "關於 A321 起飛時，下列敘述何者錯誤？",
    "opts": [
      "(A) 機外溫度降低",
      "(B) 機外空氣密度變小",
      "(C) 機艙內壓力變大",
      "(D) 機內空氣密度變小"
    ],
    "ans": 2,
    "exp": "飛機起飛爬升時，外部大氣壓力隨高度增加而降低，客艙增壓系統會讓客艙高度（Cabin Altitude）略微上升，因此機艙內壓力是「變小」而非變大。"
  },
  {
    "id": "Q2",
    "cat": "航空基礎與星宇",
    "q": "星宇航空與何家美國航空公司合作共掛班號，方便旅客從西雅圖轉往其他八個城市？",
    "opts": [
      "(A) United Airline",
      "(B) American Airline",
      "(C) Delta Airline",
      "(D) Alaska Airline"
    ],
    "ans": 3,
    "exp": "星宇航空與阿拉斯加航空（Alaska Airlines）深度合作並共掛班號，方便旅客經由西雅圖轉機前往美國內陸多個城市。"
  },
  {
    "id": "Q3",
    "cat": "航空基礎與星宇",
    "q": "現在國際上「正在營運」的雙引擎客機中，何者翼展最長？",
    "opts": [
      "(A) B777X",
      "(B) B777-300ER",
      "(C) B747-8",
      "(D) A380"
    ],
    "ans": 1,
    "exp": "題幹限定「正在營運」的雙引擎客機。B777X 尚未正式商轉交機，B747-8 與 A380 則為四引擎客機，因此已商轉雙引擎客機中翼展最長為 B777-300ER（64.8 公尺）。"
  },
  {
    "id": "Q4",
    "cat": "航空基礎與星宇",
    "q": "關於 A330 到 A330neo 的改變何者錯誤？",
    "opts": [
      "(A) 新設計的翼尖小翼",
      "(B) 更寬的機身",
      "(C) 新研發的複合式材料機身",
      "(D) 更有效率的引擎"
    ],
    "ans": 1,
    "exp": "A330neo 延續 A330 的機身寬度並未變寬，主要升級為 Rolls-Royce Trent 7000 高效率引擎與全新翼尖小翼（Sharklets）。"
  },
  {
    "id": "Q5",
    "cat": "航空基礎與星宇",
    "q": "請問台灣國籍航空公司沒有營運過下列何種機型？",
    "opts": [
      "(A) ERJ",
      "(B) C919",
      "(C) Dash8-400",
      "(D) ATR-72"

    "ans": 1,
    "exp": "C919 為中國商飛研製的單走道客機，台灣國籍航空未曾營運。ERJ（華信）、Dash8-400（立榮）、ATR-72（立榮/華信/復興）皆曾營運。"
  },
  {
    "id": "Q6",
    "cat": "航空基礎與星宇",
    "q": "跑道的標示由幾位數字組成？",
    "opts": [
      "(A) 1",
      "(B) 2",
      "(C) 3",
      "(D) 4"
    ],
    "ans": 1,
    "exp": "跑道編號以跑道磁航向除以 10 四捨五入，由 2 位數字（01 至 36）組成，若為平行跑道則加上 L、C、R。"
  },
  {
    "id": "Q7",
    "cat": "航空基礎與星宇",
    "q": "關於永續燃油（SAF）下列何者正確？",
    "opts": [
      "(A) 屬於新型態氫能源",
      "(B) 屬於用燃料發電的乾淨能源",
      "(C) 歐盟國家的航空公司已經 100% 使用",
      "(D) 為傳統燃油與再生燃料混合"

    "ans": 3,
    "exp": "永續航空燃油（SAF）是由生質廢油或再生原料製成，目前實務上需與傳統航空燃油（Jet A-1）按一定比例混合使用。"
  },
  {
    "id": "Q8",
    "cat": "航空基礎與星宇",
    "q": "星宇航空飛行外套的 Slogan 為何？",
    "opts": [
      "(A) Safety is our attitude",
      "(B) Safety is our first priority",
      "(C) Safety is our top priority",
      "(D) Safety above all"
    ],
    "ans": 0,
    "exp": "星宇航空飛行夾克及飛安核心精神標語為「Safety is our attitude」。"
  },
  {
    "id": "Q9",
    "cat": "計算與方位時區",
    "q": "經緯度網格中，橫軸由左至右為 120°E → 100°E → 80°E（往右向西），縱軸由上至下為 40°S → 30°S → 20°S → 10°S（往下向北）。若 A 位於 (20°S, 120°E)、B 位於 (40°S, 120°E)，請問從 A 到 B 是往哪個方向？",
    "opts": [
      "(A) 北",
      "(B) 東北",
      "(C) 南",
      "(D) 西南"
    ],
    "ans": 2,
    "exp": "A 與 B 位於同一條經線上（同為 120°E），而 B 的緯度 40°S 比 A 的 20°S 更靠近南極，因此從 A 到 B 為正南方 (C)。"
  },
  {
    "id": "Q10",
    "cat": "飛航與航空常識",
    "q": "決定要帶多少燃油時，無需考慮以下哪個因素？",
    "opts": [
      "(A) 天氣",
      "(B) 儀器進場和誤失進場",
      "(C) 公司規定要帶多少",
      "(D) 航管延遲"
    ],
    "ans": 2,
    "exp": "依考題標準選項為 (C)（註：實務上燃油計畫會考量滑行、航程、不可預期、備降、最終備用油及公司/機長額外加載油量）。"
  },
  {
    "id": "Q11",
    "cat": "航空基礎與星宇",
    "q": "星宇跟 NBA 和 MLB 的球隊合作，分別是？",
    "opts": [
      "(A) 湖人隊和道奇隊",
      "(B) 快艇隊和道奇隊",
      "(C) 雷霆隊和小熊隊",
      "(D) 快艇隊和巨人隊"
    ],
    "ans": 1,
    "exp": "星宇航空開航洛杉磯後，與 NBA 洛杉磯快艇隊（LA Clippers）及 MLB 洛杉磯道奇隊（LA Dodgers）展開官方合作。"
  },
  {
    "id": "Q12",
    "cat": "航空基礎與星宇",
    "q": "下列何者非民航機製造商？",
    "opts": [
      "(A) Embraer",
      "(B) Mitsubishi Heavy Industries",
      "(C) General Dynamics",
      "(D) CFM"
    ],
    "ans": 2,
    "exp": "General Dynamics（通用動力）主要為美國國防與軍工航太承包商（旗下灣流 Gulfstream 主攻商務噴射機，非大型民航客機製造商；題庫標準答案為 C）。"
  },
  {
    "id": "Q13",
    "cat": "航空基礎與星宇",
    "q": "【改編題】關於 Airbus A350-900 與 A350-1000 的比較，下列敘述何者正確？",
    "opts": [
      "(A) A350-900 的機身較長，載客量較多",
      "(B) A350-1000 的主起落架每側為 6 輪，A350-900 每側為 4 輪",
      "(C) 兩者使用的引擎型號完全不同，A350-1000 改用 GE 引擎",

    "ans": 1,
    "exp": "A350-1000 機身較長、最大起飛重量（MTOW）更高，為承受更大重量，其主起落架升級為每側 6 輪（A350-900 為每側 4 輪）。兩者皆採用 Rolls-Royce Trent XWB 引擎。"
  },
  {
    "id": "Q14",
    "cat": "航空基礎與星宇",
    "q": "BelugaXL（超級大白鯨運輸機）是由哪一架機型改裝？",
    "opts": [
      "(A) A300",
      "(B) A350",
      "(C) A380",
      "(D) A330"
    ],
    "ans": 3,
    "exp": "Airbus BelugaXL 是基於 A330-200 貨機平台改裝而成，用來運送空中巴士各工廠之間的大型飛機組件。"
  },
  {
    "id": "Q15",
    "cat": "航空基礎與星宇",
    "q": "哪一架雙引擎民航機的翼展最長？",
    "opts": [

      "(B) B777-200ER",

  {

      "(B) B-58101",
      "(C) B-58201",
      "(D) B-58801"
    ],
    "ans": 2,
    "exp": "星宇航空 A321neo 機隊編號為 B-582xx（如首架 B-58201）；A330neo 為 B-583xx；A350 為 B-585xx。"
  },
  {

    "ans": 2,
    "exp": "緯度從 25°N 變為 35°N（往北），經度從 121°E 變為 105°E（往西），故航向大致為西北方。"

  {
    "id": "Q18",
    "cat": "飛航與航空常識",

    // State Management
    const STORAGE_KEY = 'starlux_quiz_state_v1';
    let state = {
      mastered: [],      // array of question ids answered correctly
      wrong: [],         // array of question ids currently in wrong book
      streak: 0,
      lastCompletedDate: null,
      dailyDate: null,
      dailyIds: [],
      dailyAnswers: {}   // { qId: selectedOptionIndex }
    };

    function loadState() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
        if (saved) state = { ...state, ...saved };
      } catch (e) {}
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      updateHeaderStats();
    }

    function getTodayStr() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }

    function updateHeaderStats() {
      document.getElementById('streakCount').textContent = state.streak;
      document.getElementById('masteredCount').textContent = state.mastered.length;
      document.getElementById('wrongBadge').textContent = state.wrong.length;
    }

    // Tab Navigation
    function switchTab(tab) {
      ['daily', 'practice', 'wrong', 'browse'].forEach(t => {
        document.getElementById(`view-${t}`).classList.add('hidden');
        const btn = document.getElementById(`tab-${t}`);
        btn.classList.remove('border-[#d4af37]', 'text-[#d4af37]');
        btn.classList.add('border-transparent', 'text-gray-400');
      });
      document.getElementById(`view-${tab}`).classList.remove('hidden');
      const activeBtn = document.getElementById(`tab-${tab}`);
      activeBtn.classList.add('border-[#d4af37]', 'text-[#d4af37]');
      activeBtn.classList.remove('border-transparent', 'text-gray-400');

      if (tab === 'daily') renderDailyQuiz();
      if (tab === 'practice') renderPracticeCard();
      if (tab === 'wrong') renderWrongBook();
      if (tab === 'browse') renderBrowseList();
    }

    // Daily 10 Logic
    function initDailySet() {
      const today = getTodayStr();
      document.getElementById('todayDateLabel').textContent = today;
      if (state.dailyDate !== today || !state.dailyIds || state.dailyIds.length === 0) {
        generateNewDailySet(false);
      }
    }

    function generateNewDailySet(forceNew) {
      const today = getTodayStr();
      // Prioritize: 1) Wrong questions, 2) Unmastered questions, 3) Random rest
      const wrongPool = QUESTIONS.filter(q => state.wrong.includes(q.id));
      const unmasteredPool = QUESTIONS.filter(q => !state.mastered.includes(q.id) && !state.wrong.includes(q.id));
      const masteredPool = QUESTIONS.filter(q => state.mastered.includes(q.id));

      const shuffle = arr => [...arr].sort(() => Math.random() - 0.5);
      const combined = [...shuffle(wrongPool), ...shuffle(unmasteredPool), ...shuffle(masteredPool)];
      const selected = combined.slice(0, 10).map(q => q.id);

      state.dailyDate = today;
      state.dailyIds = selected;
      state.dailyAnswers = {};
      saveState();
      if (forceNew) renderDailyQuiz();
    }

    function answerDaily(qId, optIdx) {
      if (state.dailyAnswers[qId] !== undefined) return;
      state.dailyAnswers[qId] = optIdx;
      const qObj = QUESTIONS.find(q => q.id === qId);
      recordResult(qObj, optIdx === qObj.ans);

      // Check if all 10 completed
      if (Object.keys(state.dailyAnswers).length === state.dailyIds.length) {
        const today = getTodayStr();
        if (state.lastCompletedDate !== today) {
          state.streak += 1;
          state.lastCompletedDate = today;
        }
      }
      saveState();
      renderDailyQuiz();
    }

    function recordResult(qObj, isCorrect) {
      if (isCorrect) {
        if (!state.mastered.includes(qObj.id)) state.mastered.push(qObj.id);
        state.wrong = state.wrong.filter(id => id !== qObj.id);
      } else {
        if (!state.wrong.includes(qObj.id)) state.wrong.push(qObj.id);
      }
    }

    function renderDailyQuiz() {
      const container = document.getElementById('dailyQuizContainer');
      const answeredCount = Object.keys(state.dailyAnswers).length;
      const correctCount = state.dailyIds.filter(id => {
        const q = QUESTIONS.find(item => item.id === id);
        return state.dailyAnswers[id] !== undefined && state.dailyAnswers[id] === q.ans;
      }).length;

      let summaryHtml = '';
      if (answeredCount === state.dailyIds.length && state.dailyIds.length > 0) {
        summaryHtml = `
          <div class="rounded-xl p-5 bg-gradient-to-r from-amber-500/20 to-emerald-500/20 border border-amber-400/40 text-center space-y-2">
            <div class="text-2xl">🎉 今日 10 題打卡完成！</div>
            <p class="text-sm text-gray-200">本次答對 <strong class="text-amber-300 text-lg">${correctCount} / 10</strong> 題・累計連續打卡 <strong class="text-white">${state.streak}</strong> 天</p>
            <button onclick="generateNewDailySet(true)" class="mt-2 px-4 py-2 rounded-lg starlux-bg-gold text-gray-950 font-bold text-sm hover:opacity-90">
              再加練 10 題
            </button>
          </div>
        `;
      }

      const cardsHtml = state.dailyIds.map((id, idx) => {
        const q = QUESTIONS.find(item => item.id === id);
        const userAns = state.dailyAnswers[id];
        return buildQuestionCardHtml(q, idx + 1, userAns, `answerDaily('${q.id}', OPT_IDX)`);
      }).join('');

      container.innerHTML = summaryHtml + cardsHtml;
    }

    // Practice All Logic
    let practiceList = [...QUESTIONS];
    let practiceIdx = 0;
    let practiceUserAns = null;

    function resetPractice() {
      const cat = document.getElementById('categoryFilter').value;
      const order = document.getElementById('orderFilter').value;
      let list = cat === 'ALL' ? [...QUESTIONS] : QUESTIONS.filter(q => q.cat === cat);
      if (order === 'UNMASTERED') {
        list = list.filter(q => !state.mastered.includes(q.id));
      }
      if (order === 'SHUFFLE') {
        list.sort(() => Math.random() - 0.5);
      }
      practiceList = list;
      practiceIdx = 0;
      practiceUserAns = null;
      renderPracticeCard();
    }

    function answerPractice(optIdx) {
      if (practiceUserAns !== null) return;
      practiceUserAns = optIdx;
      const q = practiceList[practiceIdx];
      recordResult(q, optIdx === q.ans);
      saveState();
      renderPracticeCard();
    }

    function nextPractice(delta) {
      if (practiceList.length === 0) return;
      practiceIdx = (practiceIdx + delta + practiceList.length) % practiceList.length;
      practiceUserAns = null;
      renderPracticeCard();
    }

    function renderPracticeCard() {
      const container = document.getElementById('singleQuestionCard');
      if (practiceList.length === 0) {
        document.getElementById('practiceProgressText').textContent = '0 / 0';
        container.innerHTML = `<div class="card-bg rounded-xl p-8 text-center text-gray-400">太強了！此分類下所有題目都已全部答對掌握！</div>`;
        return;
      }
      document.getElementById('practiceProgressText').textContent = `${practiceIdx + 1} / ${practiceList.length}`;
      const q = practiceList[practiceIdx];
      const card = buildQuestionCardHtml(q, practiceIdx + 1, practiceUserAns, `answerPractice(OPT_IDX)`);
      const nav = `
        <div class="flex items-center justify-between mt-4">
          <button onclick="nextPractice(-1)" class="px-4 py-2 rounded-lg bg-gray-800 hover:bg-gray-700 text-sm text-gray-200 border border-gray-700">
            ← 上一題
          </button>
          <button onclick="nextPractice(1)" class="px-5 py-2 rounded-lg starlux-bg-gold text-gray-950 font-bold text-sm hover:opacity-90">
            下一題 →
          </button>
        </div>
      `;
      container.innerHTML = card + nav;
    }

    // Wrong Book Logic
    let wrongAnswersTemp = {};
    function answerWrong(qId, optIdx) {
      if (wrongAnswersTemp[qId] !== undefined) return;
      wrongAnswersTemp[qId] = optIdx;
      const q = QUESTIONS.find(item => item.id === qId);
      if (optIdx === q.ans) {
        recordResult(q, true);
        saveState();
      }
      renderWrongBook();
    }

    function clearWrongBook() {
      state.wrong = [];
      wrongAnswersTemp = {};
      saveState();
      renderWrongBook();
    }

    function renderWrongBook() {
      const container = document.getElementById('wrongListContainer');
      const wrongQs = QUESTIONS.filter(q => state.wrong.includes(q.id));
      if (wrongQs.length === 0 && Object.keys(wrongAnswersTemp).length === 0) {
        container.innerHTML = `<div class="card-bg rounded-xl p-10 text-center text-gray-400">目前錯題本是空的，繼續保持！✈️</div>`;
        return;
      }
      // Show active wrong questions plus any just answered in this session
      const displayIds = Array.from(new Set([...state.wrong, ...Object.keys(wrongAnswersTemp)]));
      const list = displayIds.map(id => QUESTIONS.find(q => q.id === id)).filter(Boolean);
      container.innerHTML = list.map((q, idx) =>
        buildQuestionCardHtml(q, idx + 1, wrongAnswersTemp[q.id], `answerWrong('${q.id}', OPT_IDX)`)
      ).join('');
    }

    // Browse & Search Logic
    let showAllBrowseAns = false;
    function toggleAllAnswersBrowse() {
      showAllBrowseAns = !showAllBrowseAns;
      renderBrowseList();
    }

    function renderBrowseList() {
      const kw = (document.getElementById('searchInput').value || '').trim().toLowerCase();
      const filtered = QUESTIONS.filter(q =>
        !kw ||
        q.id.toLowerCase().includes(kw) ||
        q.q.toLowerCase().includes(kw) ||
        q.exp.toLowerCase().includes(kw) ||
        q.opts.some(o => o.toLowerCase().includes(kw))
      );
      document.getElementById('browseCountLabel').textContent = `共顯示 ${filtered.length} / ${QUESTIONS.length} 題`;

      document.getElementById('browseListContainer').innerHTML = filtered.map(q => `
        <div class="card-bg rounded-xl p-4 space-y-2.5">
          <div class="flex items-center justify-between gap-2">
            <div class="flex items-center gap-2">
              <span class="px-2 py-0.5 rounded text-xs font-bold bg-gray-800 text-amber-300 border border-gray-700">${q.id}</span>
              <span class="text-xs text-gray-400">${q.cat}</span>
            </div>
            ${state.mastered.includes(q.id) ? '<span class="text-xs text-emerald-400">✓ 已掌握</span>' : ''}
          </div>
          <p class="text-sm sm:text-base font-medium text-white">${q.q}</p>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-1.5 text-xs sm:text-sm text-gray-300">
            ${q.opts.map((opt, i) => `
              <div class="px-3 py-1.5 rounded bg-gray-900/70 border ${showAllBrowseAns && i === q.ans ? 'border-emerald-500/70 text-emerald-300 font-bold' : 'border-gray-800'}">
                ${opt}
              </div>
            `).join('')}
          </div>
          <details ${showAllBrowseAns ? 'open' : ''} class="text-xs sm:text-sm text-gray-300 bg-gray-900/90 rounded-lg p-3 border border-gray-800">
            <summary class="cursor-pointer text-amber-400 font-medium select-none">查看正確答案與解析</summary>
            <div class="mt-2 pt-2 border-t border-gray-800 space-y-1">
              <div class="text-emerald-400 font-bold">正確答案：${q.opts[q.ans]}</div>
              <p class="text-gray-300 leading-relaxed">${q.exp}</p>
            </div>
          </details>
        </div>
      `).join('');
    }

    // Reusable Question Card Builder
    function buildQuestionCardHtml(q, displayNum, userAns, clickHandlerTemplate) {
      const isAnswered = userAns !== undefined && userAns !== null;
      const isCorrect = isAnswered && userAns === q.ans;

      const optionsHtml = q.opts.map((opt, i) => {
        let btnClass = 'bg-gray-900/80 border-gray-700 text-gray-200';
        let badge = '';
        if (isAnswered) {
          if (i === q.ans) {
            btnClass = 'bg-emerald-950/70 border-emerald-500 text-emerald-200 font-bold';
            badge = '<span class="text-emerald-400 text-xs font-bold">✓ 正解</span>';
          } else if (i === userAns) {
            btnClass = 'bg-red-950/70 border-red-500 text-red-200';
            badge = '<span class="text-red-400 text-xs font-bold">✗ 你的選擇</span>';
          } else {
            btnClass = 'bg-gray-900/40 border-gray-800 text-gray-500';
          }
        }
        const onclickAttr = isAnswered ? '' : `onclick="${clickHandlerTemplate.replace('OPT_IDX', i)}"`;
        return `
          <button ${onclickAttr} ${isAnswered ? 'disabled' : ''} class="opt-btn w-full text-left px-4 py-3 rounded-lg border ${btnClass} flex items-center justify-between gap-2 text-sm sm:text-base">
            <span>${opt}</span>
            ${badge}
          </button>
        `;
      }).join('');

      const explanationHtml = isAnswered ? `
        <div class="mt-3 p-3.5 rounded-lg ${isCorrect ? 'bg-emerald-950/30 border border-emerald-800/50' : 'bg-amber-950/30 border border-amber-800/50'} text-sm space-y-1">
          <div class="font-bold ${isCorrect ? 'text-emerald-400' : 'text-amber-300'}">
            ${isCorrect ? '🎯 答對了！' : '💡 錯題解析'}
          </div>
          <p class="text-gray-200 leading-relaxed">${q.exp}</p>
        </div>
      ` : '';

      return `
        <div class="card-bg rounded-xl p-5 space-y-3.5 shadow-sm">
          <div class="flex items-center justify-between gap-2">
            <div class="flex items-center gap-2">
              <span class="px-2.5 py-0.5 rounded-md text-xs font-bold bg-[#d4af37]/20 text-[#d4af37] border border-[#d4af37]/30">
                第 ${displayNum} 題・${q.id}
              </span>
              <span class="text-xs text-gray-400">${q.cat}</span>
            </div>
            ${state.wrong.includes(q.id) ? '<span class="text-xs px-2 py-0.5 rounded bg-red-500/20 text-red-300">錯題復習</span>' : ''}
          </div>
          <h3 class="text-base sm:text-lg font-bold text-white leading-snug">${q.q}</h3>
          <div class="space-y-2">
            ${optionsHtml}
          </div>
          ${explanationHtml}
        </div>
      `;
    }

    // Boot
    loadState();
    initDailySet();
    updateHeaderStats();
    renderDailyQuiz();
  </script>
</body>
</html>
